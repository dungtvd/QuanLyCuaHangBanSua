<!DOCTYPE html>

<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Staff Panel</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background: #f5f7fa;
}

/* SIDEBAR */
.sidebar {
    width: 240px;
    height: 100vh;
    position: fixed;
    background: #111827;
    color: white;
    padding: 20px;
}

.sidebar h4 {
    margin-bottom: 20px;
}

.sidebar a {
    display: block;
    color: #d1d5db;
    text-decoration: none;
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 8px;
}

.sidebar a:hover {
    background: #1f2937;
    color: white;
}

/* MAIN */
.main {
    margin-left: 260px;
    padding: 25px;
}

/* CARD */
.card {
    border-radius: 12px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.08);
}
</style>

</head>

<body>

<div class="sidebar">
    <h4>🧑‍💼 Staff</h4>

<a href="/staff/">📊 Dashboard</a>
<a href="/staff/create/">➕ Tạo đơn</a>

<hr>

<a href="/staff/logout/" class="text-danger">🚪 Logout</a>


</div>

<div class="main">
    {% block content %}{% endblock %}
</div>

</body>
</html>
