<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Staff Login</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", sans-serif;
}

body {
    height: 100vh;
    background: linear-gradient(135deg, #667eea, #764ba2);
    display: flex;
    justify-content: center;
    align-items: center;
}

/* glass card */
.login-box {
    width: 350px;
    padding: 30px;
    border-radius: 15px;
    backdrop-filter: blur(15px);
    background: rgba(255,255,255,0.15);
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    color: white;
    text-align: center;
    animation: fadeIn 0.8s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px);}
    to { opacity: 1; transform: translateY(0);}
}

h2 {
    margin-bottom: 20px;
}

/* input group */
.input-group {
    position: relative;
    margin: 15px 0;
}

.input-group input {
    width: 100%;
    padding: 12px 40px;
    border: none;
    border-radius: 8px;
    outline: none;
}

/* icon */
.input-group i {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
}

/* show password */
.toggle-pass {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
}

/* button */
button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #00c6ff;
    color: white;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #0072ff;
}

/* loading */
button.loading {
    pointer-events: none;
    opacity: 0.7;
}

/* error */
.error {
    color: #ffb3b3;
    margin-top: 10px;
}

/* footer */
.footer {
    margin-top: 15px;
    font-size: 13px;
    opacity: 0.8;
}
</style>

</head>
<body>

<div class="login-box">
    <h2>🔐 Staff Login</h2>

    <form method="post" onsubmit="showLoading()">
        {% csrf_token %}

        <div class="input-group">
            <i>👤</i>
            <input type="text" name="username" placeholder="Tên đăng nhập" required>
        </div>

        <div class="input-group">
            <i>🔒</i>
            <input type="password" id="password" name="password" placeholder="Mật khẩu" required>
            <span class="toggle-pass" onclick="togglePass()">👁</span>
        </div>

        <button id="loginBtn">Đăng nhập</button>
    </form>

    {% for message in messages %}
        <p class="error">{{ message }}</p>
    {% endfor %}

    <div class="footer">
        Milk Store © 2026
    </div>
</div>

<script>
function togglePass() {
    const pass = document.getElementById("password");
    pass.type = pass.type === "password" ? "text" : "password";
}

function showLoading() {
    const btn = document.getElementById("loginBtn");
    btn.innerText = "Đang đăng nhập...";
    btn.classList.add("loading");
}
</script>

</body>
</html>
